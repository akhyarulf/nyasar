name: Release APK (GitHub Releases)

# Distribusi resmi TANPA Play Store: setiap tag v* membangun APK release
# (ditandatangani keystore dari repo secrets) lalu membuat GitHub Release
# dengan APK terlampir. Tombol "Unduh APK" di landing web menunjuk ke
# .../releases/latest, jadi rilis terbaru selalu yang terunduh.
# Tanpa Play Store: biaya $25 (sekali bayar) dihindari, APK sideload tetap
# lolos verifikasi App Links karena cert signing-nya sama.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK to GitHub Releases
    runs-on: ubuntu-latest

    steps:
      # Graceful skip sama seperti release.yaml: sebelum secrets signing ada,
      # job hanya memperingatkan; CI tetap hijau.
      - name: Check signing secrets are configured
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not set yet (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). No APK will be published — add them under Settings -> Secrets and variables -> Actions, then re-tag."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (preinstalled runner SDK)
        if: steps.secrets.outputs.configured == 'true'
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Decode release keystore from KEYSTORE_BASE64
        if: steps.secrets.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/nyasar-release.keystore

      - name: Write local.properties (config dari repo secrets)
        if: steps.secrets.outputs.configured == 'true'
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> local.properties
          echo "GOOGLE_OAUTH_WEB_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}" >> local.properties

      - name: Set up Gradle
        if: steps.secrets.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # assembleRelease menghasilkan APK release yang ditandatangani lewat
      # signingConfig dari env KEYSTORE_* (lihat app/build.gradle.kts).
      # APK — bukan AAB — karena distribusi sideload; AAB hanya untuk Play.
      - name: Build signed release APK (assembleRelease)
        if: steps.secrets.outputs.configured == 'true'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/nyasar-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      # Nama file stabil → link unduh permanen:
      # https://github.com/akhyarulf/nyasar/releases/latest/download/Nyasar.apk
      - name: Rename APK to Nyasar.apk
        if: steps.secrets.outputs.configured == 'true'
        run: |
          cp app/build/outputs/apk/release/app-release.apk Nyasar.apk
          ls -la Nyasar.apk

      - name: Publish GitHub Release
        if: steps.secrets.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then
            # Manual dispatch tanpa tag: buat tag tanggal otomatis.
            TAG="v$(date -u +%Y.%m.%d-%H%M)"
          fi
          gh release create "$TAG" Nyasar.apk \
            --target "$GITHUB_SHA" \
            --title "Nyasar $TAG" \
            --generate-notes \
            --notes "Unduh **Nyasar.apk**, buka di HP, izinkan install dari sumber tidak dikenal bila diminta. Download **Nyasar.apk**, open it on your phone, allow installs from unknown sources when asked."
          echo "Released: https://github.com/akhyarulf/nyasar/releases/tag/$TAG"
