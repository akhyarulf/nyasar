name: Build Nyasar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Debug builds are normally signed with an auto-generated
      # ~/.config/.android/debug.keystore, which GitHub's ubuntu-latest
      # runners regenerate on every fresh run — so its SHA-1 changed every
      # build, breaking Google Sign-In each time. Fix: after Gradle builds
      # the (debug-signed) APK, strip that signature and re-sign with the
      # same release keystore used in release.yaml (from KEYSTORE_BASE64).
      # That keystore is a fixed file from a repo secret, so its SHA-1
      # never changes — Google Sign-In stays working across every CI run.
      - name: Decode release keystore from KEYSTORE_BASE64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/nyasar-release.keystore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 removed: it tries to install the
      # deprecated "tools" package, which Google deleted from the SDK repo
      # ("Failed to find package 'tools'") and the job died in ~20s. The
      # ubuntu-latest runner ships a full Android SDK at $ANDROID_SDK_ROOT
      # with cmdline-tools preinstalled — just accept licenses and build.
      - name: Accept Android SDK licenses (preinstalled runner SDK)
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Write local.properties (MapTiler key from repo secret, if set)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> local.properties
          echo "GOOGLE_OAUTH_WEB_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_WEB_CLIENT_ID }}" >> local.properties
        # If you never add a MAPTILER_API_KEY secret in
        # Settings -> Secrets and variables -> Actions, this just writes an
        # empty key. The app still builds and runs fine — TileProviderFactory
        # falls back to OpenFreeMap automatically since it needs no key.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unit tests (JVM)
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Re-sign debug APK with the release keystore (fixed SHA-1)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -iname "*.apk" | head -n 1)
          echo "Original debug APK: $APK_PATH"

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          # zipalign first: apksigner requires an aligned APK as input.
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$APK_PATH" app-debug-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks keystore/nyasar-release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK_PATH" \
            app-debug-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify "$APK_PATH" && echo "Re-signed APK verified OK"

      - name: Print keystore SHA-1 (for Google Sign-In OAuth client)
        run: |
          keytool -list -v \
            -keystore keystore/nyasar-release.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}"
        # Copy the SHA1 value this prints into Google Cloud Console ->
        # Clients -> your ANDROID OAuth client -> SHA-1 certificate
        # fingerprint. This is the release keystore's fingerprint — fixed
        # forever, since the keystore file itself never changes.

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyasar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
