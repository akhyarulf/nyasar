<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyasar — Rute Pendakian</title>
<meta name="description" content="Detail rute pendakian publik yang dibagikan lewat aplikasi Nyasar — jarak, elevasi, kesulitan, dan file GPX siap unduh.">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="../index.html"><span class="brand-mark">⛰</span> Nyasar</a>
    <span class="spacer"></span>
    <nav class="nav-links">
      <a href="../index.html#features" data-i18n="nav.features">Fitur</a>
      <span class="lang-switch" role="group" aria-label="Bahasa / Language">
        <button type="button" data-lang="id">ID</button>
        <button type="button" data-lang="en">EN</button>
      </span>
    </nav>
  </div>
</header>

<main class="route-main">
  <div class="route-card">
    <h1 id="route-name" data-i18n="route.load">Memuat rute…</h1>
    <p class="meta" id="route-meta"></p>
    <div class="route-stats" id="route-stats" hidden>
      <div class="route-stat"><b id="stat-distance">-</b><span data-i18n="route.dist">Jarak</span></div>
      <div class="route-stat"><b id="stat-elevation">-</b><span data-i18n="route.elev">Elevasi</span></div>
      <div class="route-stat"><b id="stat-difficulty">-</b><span data-i18n="route.diff">Kesulitan</span></div>
    </div>
  </div>

  <div class="route-card">
    <div class="route-actions">
      <a class="btn btn-primary" href="#" id="download-btn" hidden>⬇ <span data-i18n="route.dl">Unduh file GPX</span></a>
      <p class="route-hint" id="download-hint" data-i18n="route.dl.hint">Buka rute ini langsung di aplikasi Nyasar untuk navigasi offline.</p>
      <a class="btn btn-ghost" href="../index.html" data-i18n="route.learn">Pelajari aplikasinya</a>
    </div>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span>© 2026 Nyasar</span>
    <span>
      <a href="../privacy-policy.html" data-i18n="footer.privacy">Privacy Policy</a> &nbsp;·&nbsp;
      <a href="../terms-of-service.html" data-i18n="footer.terms">Terms of Service</a>
    </span>
  </div>
</footer>

<!-- config.js di-generate workflow Pages saat deploy (Supabase endpoints);
     fallback inline menjaga halaman tetap jalan tanpa detail bila gagal. -->
<script>
  window.NYASAR_SUPABASE_URL = window.NYASAR_SUPABASE_URL || '';
  window.NYASAR_SUPABASE_ANON_KEY = window.NYASAR_SUPABASE_ANON_KEY || '';
</script>
<script src="../config.js"></script>
<script src="../lang.js"></script>
<script>
  // Toggle bahasa
  document.querySelectorAll(".lang-switch button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (window.nyasarApplyLang) window.nyasarApplyLang(b.getAttribute("data-lang"));
    });
  });

  // Teks rute punya beberapa state — kubuatkan peta state → i18n key supaya
  // perubahan bahasa SETELAH fetch selesai tetap konsisten.
  var ROUTE_STATE = { kind: null, data: null };
  function renderRoute() {
    var lang = window.NYASAR_LANG || "id";
    var T = {
      load: lang === "en" ? "Loading route…" : "Memuat rute…",
      notfound: lang === "en" ? "Route unavailable" : "Rute tidak tersedia",
      notfoundD: lang === "en" ? "This route is private, was removed, or the link is invalid." : "Rute ini privat, sudah dihapus, atau tautannya tidak valid.",
      generic: lang === "en" ? "Nyasar route" : "Rute Nyasar",
      genericD: lang === "en" ? "Full route details are available in the Nyasar app — get it via the button below." : "Detail rute tersedia di aplikasi Nyasar — unduh lewat tombol di bawah.",
      byline: lang === "en" ? "A public hiking route shared via Nyasar" : "Rute pendakian publik dibagikan lewat Nyasar",
      diff: lang === "en" ? "Not rated" : "Belum dinilai"
    };
    var nameEl = document.getElementById("route-name");
    var metaEl = document.getElementById("route-meta");
    var stats = document.getElementById("route-stats");
    var dl = document.getElementById("download-btn");
    var hint = document.getElementById("download-hint");

    if (ROUTE_STATE.kind === "ok" && ROUTE_STATE.data) {
      var r = ROUTE_STATE.data;
      nameEl.textContent = r.name || T.generic;
      metaEl.textContent = T.byline;
      stats.hidden = false;
      document.getElementById("stat-distance").textContent =
        r.distance_meters ? (r.distance_meters / 1000).toFixed(1) + " km" : "-";
      document.getElementById("stat-elevation").textContent =
        r.elevation_gain_m ? "+" + Math.round(r.elevation_gain_m) + " m" : "-";
      document.getElementById("stat-difficulty").textContent = r.difficulty || T.diff;
      dl.hidden = false;
      hint.hidden = true;
      dl.href = window.NYASAR_SUPABASE_URL + "/storage/v1/object/public/route-gpx/" + r.id + ".gpx.gz";
    } else if (ROUTE_STATE.kind === "missing") {
      nameEl.textContent = T.notfound;
      metaEl.textContent = T.notfoundD;
    } else if (ROUTE_STATE.kind === "generic") {
      nameEl.textContent = T.generic;
      metaEl.textContent = T.genericD;
    } else {
      nameEl.textContent = T.load;
    }
  }

  // Re-render saat bahasa diganti (hook setelah apply() bawaan).
  (function () {
    var original = window.nyasarApplyLang;
    window.nyasarApplyLang = function (lang) {
      original(lang);
      renderRoute();
    };
  })();

  (function () {
    var id = new URLSearchParams(location.search).get("id");
    var SUPABASE_URL = window.NYASAR_SUPABASE_URL || "";
    var ANON_KEY = window.NYASAR_SUPABASE_ANON_KEY || "";
    if (!id) { ROUTE_STATE.kind = "generic"; renderRoute(); return; }
    if (!SUPABASE_URL || !ANON_KEY) { ROUTE_STATE.kind = "generic"; renderRoute(); return; }
    fetch(SUPABASE_URL + "/rest/v1/routes?id=eq." + encodeURIComponent(id) + "&select=id,name,is_public,difficulty,distance_meters,elevation_gain_m", {
      headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY }
    })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        var r = rows && rows[0];
        if (!r || !r.is_public) { ROUTE_STATE.kind = "missing"; renderRoute(); return; }
        ROUTE_STATE = { kind: "ok", data: r };
        renderRoute();
      })
      .catch(function () { ROUTE_STATE.kind = "generic"; renderRoute(); });
  })();
</script>
</body>
</html>
