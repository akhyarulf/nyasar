name: Build Nyasar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties (MapTiler key from repo secret, if set)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "MAPTILER_API_KEY=${{ secrets.MAPTILER_API_KEY }}" >> local.properties
        # If you never add a MAPTILER_API_KEY secret in
        # Settings -> Secrets and variables -> Actions, this just writes an
        # empty key. The app still builds and runs fine — TileProviderFactory
        # falls back to OpenFreeMap automatically since it needs no key.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyasar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
