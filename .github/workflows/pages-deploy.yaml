name: Deploy web landing (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/pages-deploy.yaml' ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Halaman route landing fetch metadata via Supabase REST anon.
      # Endpoint disuntik via dist/config.js yang digenerate saat deploy
      # (nilai non-rahasia: anon key memang publik, URL juga) — kalau
      # secret belum diset, config.js kosong dan halaman tetap jalan
      # dengan fallback "buka di aplikasi". Nama key: SUPABASE_ANON_KEY,
      # fallback ke SUPABASE_PUBLISHABLE_KEY (nama yang dipakai workflow
      # build app ini sejak awal).
      - name: Inject Supabase endpoints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p dist
          cp -a web/. dist/
          printf 'window.NYASAR_SUPABASE_URL = "%s";\nwindow.NYASAR_SUPABASE_ANON_KEY = "%s";\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > dist/config.js
          echo "config.js: $(head -c 120 dist/config.js)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
